name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Build
        run: dotnet build Tessitura.sln --configuration Release --nologo
      - name: Test
        run: dotnet test Tessitura.sln --configuration Release --no-build --nologo
        env:
          TESSITURA_CAPTURE_DIR: ${{ github.workspace }}/captures
      - name: Enumerate MIDI devices
        run: dotnet run --project tests/Tessitura.Benchmarks --configuration Release --no-build -- midi-probe list
      - name: Receive MIDI note on macOS virtual port
        if: matrix.os == 'macos-latest'
        run: dotnet run --project tests/Tessitura.Benchmarks --configuration Release --no-build -- midi-probe loopback
      - name: Upload music preview
        uses: actions/upload-artifact@v6
        with:
          name: music-preview-${{ matrix.os }}
          path: captures/music-preview.png
          if-no-files-found: error
      - name: Upload staff placement candidates
        uses: actions/upload-artifact@v6
        with:
          name: staff-placement-${{ matrix.os }}
          path: captures/f1.9-*-candidate.png
          if-no-files-found: error
      - name: Upload beam candidates
        uses: actions/upload-artifact@v6
        with:
          name: beam-candidates-${{ matrix.os }}
          path: captures/f1.10-*-candidate.png
          if-no-files-found: error
      - name: Upload first-page text candidate
        uses: actions/upload-artifact@v6
        with:
          name: first-page-text-${{ matrix.os }}
          path: captures/f1.13-first-page-candidate.png
          if-no-files-found: error
      - name: Upload reference differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reference-differences-${{ matrix.os }}
          path: tests/Tessitura.Engraving.Tests/bin/Release/net10.0/reference-diffs/*.png
          if-no-files-found: ignore
